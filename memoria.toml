version = 3

# Source and configuration stay covered. Tests and their fixtures are not documented, so a change to
# them asks no README review. go.sum files are redundant dependency lockfiles.
ignore = ["go.sum", "bench/tui/go.sum", "**/*_test.go", "**/testdata/**"]
# agentbench runs its task definitions, their setup and input generators, the services its tasks
# start, and its MCP server from testdata: they are the benchmark, not fixtures. Each task's
# repository, check, and solution stay out.
include = [
  "tools/agentbench/testdata/tasks/*/task.json", "tools/agentbench/testdata/tasks/*/setup.sh",
  "tools/agentbench/testdata/tasks/*/gen.py", "tools/agentbench/testdata/tasks/*/service/**",
  "tools/agentbench/testdata/mcp/**",
]

[documentation]
guidance = []
guidance_files = ["docs/documentation/writing.md", "docs/documentation/sections.md"]

[fingerprints]
default = "raw"
languages = {}

[lint]
missing_import_hint = false
