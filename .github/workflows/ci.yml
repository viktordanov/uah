name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The tests that skip under -short (backoff waits, built runners, the
  # performance harness) run in the slow job, beside this one, and the
  # agentbench dry run in agentbench.yml; go test compiles every package, so
  # there is no build step.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # Ubuntu 24.04's AppArmor blocks the unprivileged user namespaces bwrap
      # needs; this is the setting Codex's CI uses (.github/actions/setup-ci).
      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Test
        env:
          # The real bwrap tests in internal/sandbox fail instead of skipping.
          UAH_REQUIRE_BWRAP: "1"
        run: go test -race -short ./...
      # The Markdown benchmarks run once, so they keep compiling and running
      # (docs/design/markdown.md); the tests hold the bounds.
      - name: Benchmarks
        run: go test -run '^$' -bench . -benchtime 1x ./internal/tui/render/...

  # slow runs, in full, each package with a test that -short skips, but
  # the agentbench dry run (agentbench.yml); then, without the race detector,
  # the tests that skip under it.
  slow:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Test
        env:
          UAH_REQUIRE_BWRAP: "1"
        run: |
          packages=$(grep -rl --include='*_test.go' --exclude='*_darwin_test.go' --exclude-dir=testdata 'testing.Short()' . | xargs -n1 dirname | sort -u)
          echo "$packages"
          go test -race -skip '^TestTasksValid$' $packages
      # The performance ceilings and the Markdown renderer's every-prefix
      # tests skip under the race detector.
      - name: Test without the race detector
        run: go test ./tools/perf/perf ./internal/tui/render/markdown

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Lint both platforms' build-tagged files (the sandbox has darwin and
        # linux halves); golangci-lint type-checks for GOOS.
        goos: [linux, darwin]
    name: lint (${{ matrix.goos }})
    env:
      GOOS: ${{ matrix.goos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
